services:
    companio:
        # Deploys override IMAGE with an immutable SHA tag. The default keeps manual
        # commands such as `docker compose logs` and `docker compose ps` usable.
        image: ${IMAGE:-ghcr.io/ioeldev/companio:latest}
        restart: unless-stopped
        env_file:
            - .env
        ports:
            - "${DASHBOARD_PORT:-7777}:7777"
        environment:
            COMPANIO_WORKSPACE_ROOT: /workspace
        volumes:
            - type: bind
              source: ${COMPANIO_WORKSPACE_HOST_PATH:-/home/seed}
              target: /workspace
              bind:
                  create_host_path: false
